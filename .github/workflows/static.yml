# Deploy static content to GitHub Pages via actionsforge reusable
name: Deploy static content to Pages

on:
  workflow_run:
    workflows: ["Generate Site content"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: actionsforge/actions/.github/workflows/github-pages-deploy.yml@main
    with:
      path: ./docs
